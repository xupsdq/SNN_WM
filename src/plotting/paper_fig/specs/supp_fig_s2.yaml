figure_id: supp_fig_s2
implementation_id: fig2_supp
figure_title_draft: "Supplementary Fig. S2: Pair fusion robustness and accessibility"
experiment_root_default: results/paper_figure_multi_seed/fig2_pair_fused_stsp_state/fig2_pair_fused_stsp_state
canvas_mm: {width: 165, height: 124}
individual_axes: {left: 0.27, right: 0.97, bottom: 0.36, top: 0.88}
reading_order: [A, B, C]
expected_outputs:
  full_figure: [pdf, svg, png]
  individual_panels: [svg, png]
  resolved_spec: supp_fig_s2_resolved_spec.yaml
  source_manifest: supp_fig_s2_source_manifest.json
  qc_report: supp_fig_s2_qc_report.md
  panel_data: panel_data/*.csv
  stats: stats/*.json
  source_manifests: source_manifests/*.json
qc_requirements:
  strict_part2: true
  expected_panel_count: 3
  minimum_networks: 20
  allowed_network_counts: [20]
  require_claims: true
  require_source_manifest: true
  require_position_mm: true
  require_size_mm: true
  forbid_single_network: true
  forbid_fallback: true
group_labels:
  - {label: "Supplementary Fig. S2 - Pair fusion robustness and accessibility", x_mm: 12, y_mm: 7}
panels:
  A:
    panel_id: A
    legacy_panel_id: fig2_supp:S3A
    claim: Whole-pair representation is detectable across network layers.
    panel_type: layerwise_morphology
    producer_task: morphology
    data_adapter: s3_wpri_across_layers_adapter
    renderer: render_s3_wpri_across_layers
    source_priority: [data/metrics/supp_layerwise_morphology_metrics.csv, data/metrics/panel_d_pair_level_organization_metrics.csv]
    source_mapping: {source_package: fig2_supp, source_panel: S3A, panel_data: results/paper_figures/outputs/fig2_supp/panel_data/fig2_suppS3A_panel_data.csv}
    position_mm: {x: 12, y: 20, w: 70.5, h: 40}
    axes_mm: {x: 22, y: 22, w: 60, h: 29}
    panel_label_mm: {x: 8.5, y: 15}
    size_mm: {w: 70.5, h: 40}
    x_axis: Layer
    y_axis: WPRI
    reference_lines: [{value: 0, label: "0"}]
    expected_networks: 20
  B:
    panel_id: B
    legacy_panel_id: fig2_supp:S3C
    claim: The pair state is better captured by the complete model comparison than by simple constituent-only linear models.
    panel_type: linear_model_comparison
    producer_task: linear_mixture
    data_adapter: s3_linear_model_comparison_adapter
    renderer: render_s3_linear_model_comparison
    source_priority: [data/metrics/supp_linear_mixture_model_comparison.csv, data/metrics/panel_d_linear_mixture_fit_metrics.csv]
    source_mapping: {source_package: fig2_supp, source_panel: S3C, panel_data: results/paper_figures/outputs/fig2_supp/panel_data/fig2_suppS3C_panel_data.csv, forbidden_fallback: residual_pair_specificity}
    model_order: [A_only, B_only, mean_AB, sum_AB, unconstrained_AB, convex_AB]
    position_mm: {x: 88.5, y: 20, w: 70.5, h: 40}
    axes_mm: {x: 101, y: 22, w: 58, h: 29}
    panel_label_mm: {x: 85, y: 15}
    size_mm: {w: 70.5, h: 40}
    x_axis: Model
    y_axis: Cross-validated R2
    expected_networks: 20
  C:
    panel_id: C
    legacy_panel_id: fig2_supp:S3E
    claim: Pair-state completion gain decays with the retention interval, defining a functional boundary.
    panel_type: completion_delay_gain
    producer_task: completion_delay_sweep
    data_adapter: s4_completion_delay_adapter
    renderer: render_s4_completion_delay_gain
    source_priority: [data/metrics/supp_completion_delay_sweep_contrast.csv, data/metrics/supp_completion_delay_sweep_metrics.csv]
    source_mapping: {source_package: fig2_supp, source_panel: S3E, panel_data: results/paper_figures/outputs/fig2_supp/panel_data/fig2_suppS3E_panel_data.csv}
    position_mm: {x: 12, y: 75, w: 147, h: 38}
    axes_mm: {x: 22, y: 78, w: 137, h: 27}
    panel_label_mm: {x: 8.5, y: 70}
    size_mm: {w: 147, h: 38}
    x_axis: Post-pair delay (ms)
    y_axis: Completion gain (pp)
    expected_delay_ms: [100, 200, 300, 400, 800, 1200]
    reference_lines: [{value: 0, label: "0"}]
    expected_networks: 20
