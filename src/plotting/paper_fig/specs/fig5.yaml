figure_id: fig5
figure_title_draft: Unit-level conversion of overlap-aligned support into local competition
experiment_root: results/paper_figure_multi_seed/fig5_local_support_competition
canvas_mm:
  width: 165
  height: 110
reading_order: [A, B, C, D, E]
argument_bands:
  - band_id: local_support
    label: Local support
    panels: [A]
  - band_id: early_transition
    label: Early transition composition
    panels: [B]
  - band_id: local_competition
    label: Winner-loser local competition
    panels: [C]
  - band_id: l2_writeback
    label: Layer2 STSP writeback
    panels: [D]
  - band_id: causal_perturbation
    label: Causal early transition probability
    panels: [E]
expected_outputs:
  full_figure: [pdf, svg, png]
  individual_panels: [svg, png]
  resolved_spec: fig5_resolved_spec.yaml
  source_manifest: fig5_source_manifest.json
  qc_report: fig5_qc_report.md
qc_requirements:
  require_claims: true
  require_source_manifest: true
  canvas_mm: {width: 165, height: 110}
  require_position_mm: true
  require_size_mm: true
  required_unit_groups: [overlap_dominant, probe_only_dominant]
  required_main_conditions:
    - dynamic_intact
    - attenuate_l1_stsp
    - reset_l1_stsp
  single_network_warning_only: true
panels:
  A:
    panel_id: A
    producer_task: preprobe_support
    panel_type: bar
    claim: Overlap-dominant units carry elevated STSP support before the probe arrives.
    data_adapter: fig5_preprobe_support_adapter
    renderer: render_fig5_preprobe_support
    source: data/metrics/panel_a_preprobe_support_metrics.csv
    position_mm: {x: 2.00, y: 10.00, w: 79.50, h: 48.00}
    size_mm: {w: 79.50, h: 48.00}
    letter_mm: {x: 0.25, y: 3.00}
    metric: preprobe_support
    unit_group_order: [probe_only_dominant, balanced, overlap_dominant]
    display_labels:
      overlap_dominant: Overlap-dominant
      probe_only_dominant: Probe-only-dominant
      balanced: Balanced
    x_axis: Unit group
    y_axis: Pre-probe STSP support
  B:
    panel_id: B
    producer_task: early_firing
    panel_type: stacked_transition_composition
    claim: Overlap units show enriched advance/recruit transitions in the early dynamic-to-static comparison.
    data_adapter: fig5_early_firing_headline_adapter
    renderer: render_fig5_early_firing_headline
    source_priority:
      - data/metrics/panel_b_transition_summary_by_group.csv
    position_mm: {x: 83.50, y: 10.00, w: 79.50, h: 48.00}
    size_mm: {w: 79.50, h: 48.00}
    letter_mm: {x: 80.00, y: 3.00}
    primary_metric: transition_fraction
    transition_types: [advance, recruit, loss]
    unit_group_order: [overlap_dominant, probe_only_dominant, random_matched]
    display_labels:
      overlap_dominant: Overlap
      probe_only_dominant: Probe-only
      random_matched: Random matched
    x_axis: Unit group
    y_axis: Transition composition (%)
  C:
    panel_id: C
    producer_task: local_events
    panel_type: event_aligned_trace
    claim: Within selected winner–loser events, the predeclared network-level winner-minus-loser dynamic-minus-static delta-V contrast is the inferential endpoint; plotted traces remain descriptive.
    data_adapter: fig5_winner_loser_adapter
    renderer: render_fig5_winner_loser_events
    source_priority:
      - data/metrics/panel_c_event_trace_summary.csv
      - data/metrics/panel_c_winner_loser_event_metrics.csv
      - data/metrics/panel_c_winner_loser_trial_summary.csv
      - data/metrics/panel_c_winner_loser_network_summary.csv
    position_mm: {x: 2.00, y: 60.00, w: 52.333, h: 48.00}
    size_mm: {w: 52.333, h: 48.00}
    letter_mm: {x: 0.25, y: 56.00}
    metrics: [winner_delta_v, loser_delta_v]
    trace_labels:
      winner_delta_v: Winner
      loser_delta_v: Loser
    inhibition_trace_definition: loser_unit_received_inhibition
    baseline_correction:
      enabled: true
      window: time_ms < 0
      role: descriptive_plot_only
    primary_statistical_metric: winner_minus_loser_delta_v
    primary_window_ms: [-8, -1]
    descriptive_window_ms: [-4, -1]
    aggregation: event_to_trial_to_network
    inference_unit: independently trained network
    reference_lines:
      - x_value: 0
        label: winner spike
    x_axis: Time from winner spike (ms)
    y_axis: Delta V (mV)
  D:
    panel_id: D
    producer_task: postprobe_stsp_update
    panel_type: grouped_bar
    claim: Prior-updated Layer2 sites have higher probe update probability, especially under dynamic probe processing.
    data_adapter: fig5_l2_writeback_adapter
    renderer: render_fig5_l2_writeback_summary
    source_priority:
      - data/metrics/panel_postprobe_l2_reupdate_history_composition.csv
    position_mm: {x: 56.333, y: 60.00, w: 52.333, h: 48.00}
    size_mm: {w: 52.333, h: 48.00}
    letter_mm: {x: 52.80, y: 56.00}
    primary_metric: l2_reupdate_probability_given_history
    comparison_conditions:
      - dynamic_intact
      - static_opportunity
    history_status_order: [prior_updated, not_prior_updated]
    display_labels:
      dynamic_intact: Dynamic STSP
      static_opportunity: Static baseline
      Dynamic: Dynamic STSP
      Static: Static baseline
      prior_updated: Prior-updated
      not_prior_updated: Not prior-updated
    x_axis: ""
    y_axis: Probe update (%)
  E:
    panel_id: E
    producer_task: support_perturbation
    panel_type: paired_network_contrast_dotplot
    claim: Across 20 networks, intact dynamics exceed Layer1-STSP attenuate/reset conditions in first-50-ms P(advance OR recruit); loss is excluded from this headline endpoint.
    data_adapter: fig5_causal_perturbation_summary_adapter
    renderer: render_fig5_causal_perturbation_summary
    source_priority:
      - data/metrics/panel_d_l1_stsp_perturbation_unit_transitions.csv
    position_mm: {x: 110.667, y: 60.00, w: 52.333, h: 48.00}
    size_mm: {w: 52.333, h: 48.00}
    letter_mm: {x: 107.00, y: 56.00}
    primary_metric: P_advance_or_recruit_dynamic_minus_condition
    analysis_window_ms: 50
    reference_condition: dynamic_intact
    comparison_conditions: [attenuate_l1_stsp, reset_l1_stsp]
    transition_types_included: [advance, recruit]
    transition_types_excluded_from_headline: [loss]
    display_labels:
      "Dynamic - Attenuate L1 STSP": "Dynamic -\nL1 attenuate"
      "Dynamic - Reset L1 STSP": "Dynamic -\nL1 reset"
    x_axis: ""
    y_axis: Change in P (pp)
supplement_outputs:
  - supp_event_chain_fraction_metrics.csv
  - supp_event_chain_null_baselines.csv
  - supp_event_selection_audit.csv
  - supp_early_window_robustness.csv
  - supp_neighborhood_radius_robustness.csv
  - supp_postprobe_l2_reupdate_history_by_trial.csv
  - supp_perturbation_ux_audit.csv
  - supp_layer_delay_local_competition_metrics.csv
  - supp_trial_condition_audit.csv
  - supp_postprobe_l2_writeback_by_network.csv
  - supp_postprobe_l2_writeback_by_trial.csv
  - supp_postprobe_l2_writeback_memory_overlap.csv
  - supp_postprobe_l2_writeback_magnitude_qc.csv
