figure_id: fig6
figure_title_draft: Overlap-gated STSP fields bias Layer 1 recruitment
experiment_root: results/paper_figure_multi_seed/fig6_peak_amplified_reentry
canvas_mm:
  width: 165
  height: 172
reading_order: [A, B, C, D, E, F]
score_name: entry_gated_stsp_gain_score
primary_endpoint: Layer 1 spatial spike enrichment / recruitment
argument_bands:
  - band_id: causal_control
    label: High-STSP-overlap control
    panels: [E]
  - band_id: entry_gated_readout
    label: Entry-gated STSP readout bias
    panels: [A]
  - band_id: l1_recruitment_prediction
    label: Layer 1 recruitment prediction
    panels: [B, C]
  - band_id: overlap_gated_expression
    label: Probe-overlap gated STSP expression
    panels: [D, F]
forbidden_language:
  - score predicts final label
  - deterministic final-label prediction
  - STSP alone determines firing
  - high STSP automatically fires without entry
  - connection weights define the main score
  - inhibition is part of the STSP score
  - peak-gated re-entry
  - route-peak perturbation
  - peaks = gain
  - overlap = route
allowed_claim_language:
  - entry-gated STSP gain predicts Layer 1 spike recruitment
  - global ping reveals local STSP score-dependent recruitment
  - real probe entry-gated score predicts Layer 1 spike deflection
  - probe overlap gates high-STSP expression
  - high STSP without probe entry is not sufficient for increased firing
  - high-STSP-overlap removal causes a larger recruitment loss than matched removal
  - STSP field biases early Layer 1 recruitment, not deterministic final-label prediction
expected_outputs:
  full_figure: [pdf, svg, png]
  individual_panels: [svg, png]
  resolved_spec: fig6_resolved_spec.yaml
  source_manifest: fig6_source_manifest.json
  qc_report: fig6_qc_report.md
required_outputs:
  - data/metrics/panel_a_high_stsp_overlap_ablation.csv
  - data/metrics/panel_a_high_stsp_overlap_ablation_summary.csv
  - data/metrics/panel_b_region_ping_readout_bias.csv
  - data/metrics/panel_c_global_ping_score_spike_prediction.csv
  - data/metrics/panel_d_real_probe_score_spike_deflection.csv
  - data/metrics/panel_e_overlap_gated_stsp_recruitment.csv
  - data/metrics/panel_e_overlap_gated_stsp_interaction.csv
  - data/raw/panel_f_global_mechanism_metadata.json
legacy_alias_outputs:
  - data/metrics/panel_f_high_stsp_overlap_ablation.csv
  - data/metrics/panel_f_high_stsp_overlap_ablation_summary.csv
qc_requirements:
  require_claims: true
  require_source_manifest: true
  require_position_mm: true
  require_size_mm: true
  canvas_mm: {width: 165, height: 172}
  score_name: entry_gated_stsp_gain_score
  score_excludes:
    - connection_weights
    - inhibition
    - voltage
    - threshold
    - WTA
    - final_label
  primary_endpoint: Layer 1 spatial spike enrichment / recruitment
  primary_early_window_ms: 10
panels:
  A:
    panel_id: A
    producer_task: field_ping_readout
    panel_type: grouped_or_stacked_bar
    claim: Different entries into the multi-item STSP field expose different serial-content biases.
    renderer: render_fig6_region_ping_readout_bias
    data_adapter: fig6_region_ping_readout_bias_adapter
    source_priority:
      - data/metrics/panel_b_region_ping_readout_bias.csv
    position_mm: {x: 8.00, y: 16.00, w: 45.00, h: 46.00}
    size_mm: {w: 45.00, h: 46.00}
    letter_mm: {x: 2.00, y: 10.00}
    metric: old_middle_recent_readout_mass
    metrics: [old_mass, recent_mass, middle_mass]
    metric_labels:
      old_mass: Old
      recent_mass: Recent
      middle_mass: Middle
    x_axis: Ping entry
    y_axis: Readout mass
    conditions: [Peak ping, Valley ping, Random ping]
    main_metric: serial_readout_mass
  B:
    panel_id: B
    producer_task: global_ping_score_spike_prediction
    panel_type: score_quantile_line
    claim: Under global unbiased ping, local STSP gain score predicts Layer 1 spike recruitment.
    renderer: render_fig6_global_ping_score_spike_prediction
    data_adapter: fig6_global_ping_score_spike_prediction_adapter
    source_priority:
      - data/metrics/panel_c_global_ping_score_spike_prediction.csv
    position_mm: {x: 60.00, y: 16.00, w: 45.00, h: 46.00}
    size_mm: {w: 45.00, h: 46.00}
    letter_mm: {x: 54.00, y: 10.00}
    metric: spike_probability_by_score_quantile
    x_axis: STSP score quantile
    y_axis: Early L1 spike probability
    primary_early_window_ms: 10
    score_name: entry_gated_stsp_gain_score
  C:
    panel_id: C
    producer_task: real_probe_score_spike_deflection
    panel_type: score_quantile_line
    claim: Under real probe input, entry-gated STSP score predicts Layer 1 spike deflection relative to baseline.
    renderer: render_fig6_real_probe_score_spike_deflection
    data_adapter: fig6_real_probe_score_spike_deflection_adapter
    source_priority:
      - data/metrics/panel_d_real_probe_score_spike_deflection.csv
    position_mm: {x: 112.00, y: 16.00, w: 45.00, h: 46.00}
    size_mm: {w: 45.00, h: 46.00}
    letter_mm: {x: 106.00, y: 10.00}
    metric: delta_spike_probability_by_score_quantile
    x_axis: STSP score quantile
    y_axis: Dynamic minus baseline L1 firing
    primary_early_window_ms: 10
    score_name: entry_gated_stsp_gain_score
  D:
    panel_id: D
    producer_task: overlap_gated_stsp_recruitment
    panel_type: two_by_two_interaction
    claim: Probe overlap gates the expression of high-STSP regions.
    renderer: render_fig6_overlap_gated_stsp_recruitment
    data_adapter: fig6_overlap_gated_stsp_recruitment_adapter
    source_priority:
      - data/metrics/panel_e_overlap_gated_stsp_recruitment.csv
      - data/metrics/panel_e_overlap_gated_stsp_interaction.csv
    position_mm: {x: 8.00, y: 82.00, w: 56.00, h: 46.00}
    size_mm: {w: 56.00, h: 46.00}
    letter_mm: {x: 2.00, y: 76.00}
    metric: overlap_gated_delta_spike_probability
    x_axis: Probe overlap
    y_axis: Dynamic minus baseline L1 firing
    primary_early_window_ms: 10
    score_name: entry_gated_stsp_gain_score
  E:
    panel_id: E
    producer_task: high_stsp_overlap_ablation
    panel_type: ablation_bar
    claim: Removing high-STSP-overlap input sites causes a larger Layer 1 recruitment loss than matched removal.
    renderer: render_fig6_high_stsp_overlap_ablation
    data_adapter: fig6_high_stsp_overlap_ablation_adapter
    source_priority:
      - data/metrics/panel_a_high_stsp_overlap_ablation_summary.csv
      - data/metrics/panel_f_high_stsp_overlap_ablation_summary.csv
    position_mm: {x: 92.00, y: 82.00, w: 56.00, h: 46.00}
    size_mm: {w: 56.00, h: 46.00}
    letter_mm: {x: 86.00, y: 76.00}
    metric: loss_delta_spike_probability
    x_axis: Removed input sites
    y_axis: Loss in L1 recruitment
    conditions: [high_stsp_overlap, matched_removal]
  F:
    panel_id: F
    producer_task: mechanism_metadata
    panel_type: mechanism_schematic
    claim: Multi-item STSP fields bias Layer 1 recruitment only where later input enters the high-gain field.
    renderer: render_fig6_blank_mechanism_placeholder
    data_adapter: fig6_global_mechanism_adapter
    source_priority:
      - data/raw/panel_f_global_mechanism_metadata.json
    position_mm: {x: 12.00, y: 140.00, w: 147.00, h: 28.00}
    size_mm: {w: 147.00, h: 28.00}
    letter_mm: {x: 2.00, y: 134.00}
    metric: mechanism_statement
    x_axis: Mechanism chain
    y_axis: Layer 1 recruitment
    score_name: entry_gated_stsp_gain_score
