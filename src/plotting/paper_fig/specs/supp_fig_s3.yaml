figure_id: supp_fig_s3
implementation_id: fig3_supp
figure_title_draft: "Supplementary Fig. S3: Multi-item compactness, serial structure and boundaries"
experiment_root_default: results/paper_figure_multi_seed/fig3_multiitem_peak_landscape
canvas_mm: {width: 165, height: 174}
individual_axes: {left: 0.25, right: 0.97, bottom: 0.35, top: 0.88}
reading_order: [A, B, C, D, E, F]
expected_outputs:
  full_figure: [pdf, svg, png]
  individual_panels: [svg, png]
  resolved_spec: supp_fig_s3_resolved_spec.yaml
  source_manifest: supp_fig_s3_source_manifest.json
  qc_report: supp_fig_s3_qc_report.md
  panel_data: panel_data/*.csv
  stats: stats/*.json
  source_manifests: source_manifests/*.json
qc_requirements:
  strict_part2: true
  expected_panel_count: 6
  minimum_networks: 20
  allowed_network_counts: [20]
  require_claims: true
  require_source_manifest: true
  require_position_mm: true
  require_size_mm: true
  forbid_single_network: true
  forbid_fallback: true
group_labels:
  - {label: "Supplementary Fig. S3 - Multi-item compactness, serial structure and boundaries", x_mm: 12, y_mm: 7, fontsize: 7.4}
panels:
  A:
    panel_id: A
    claim: Saturating morphology fits reduce error relative to linear growth within each network.
    panel_type: seed_fit_comparison
    producer_task: morphology_decomposition
    data_adapter: part2_fit_comparison_adapter
    renderer: render_part2_fit_comparison
    source: data/metrics/supp_s3a_morphology_fit_comparison.csv
    curve_source: data/metrics/supp_s3a_morphology_fit_curve_points.csv
    source_mapping: {canonical_root: results/paper_figure_multi_seed/fig3_multiitem_peak_landscape, producer_task: morphology_decomposition}
    position_mm: {x: 12, y: 20, w: 70, h: 34}
    axes_mm: {x: 22, y: 22, w: 60, h: 28}
    letter_mm: {x: 7, y: 15}
    size_mm: {w: 70, h: 34}
    x_axis: Fit comparison
    y_axis: Linear - saturating SSE
    expected_networks: 20
  B:
    panel_id: B
    legacy_panel_id: fig3_supp:S4C
    claim: Observed peak-valley structure exceeds its sequence-level null after network-first aggregation.
    panel_type: observed_null_summary
    producer_task: peak_valley_landscape
    data_adapter: part2_peak_valley_null_network_adapter
    renderer: render_s5_peak_valley_null
    source: data/metrics/supp_network_peak_valley_summary.csv
    source_mapping: {canonical_root: results/paper_figure_multi_seed/fig3_multiitem_peak_landscape, producer_task: peak_valley_landscape}
    position_mm: {x: 88, y: 20, w: 70, h: 34}
    axes_mm: {x: 101, y: 22, w: 58, h: 28}
    letter_mm: {x: 83, y: 15}
    size_mm: {w: 70, h: 34}
    aggregation: sequence_condition_to_network
    inference_unit: independently trained network
    x_axis: Observed / null / structured
    y_axis: Network-level value
    expected_networks: 20
  C:
    panel_id: C
    claim: At K=10 and 400 ms, the compressed L1 scaffold retains serial structure rather than only the latest item.
    panel_type: morphology_serial_profile
    producer_task: morphology_decomposition
    data_adapter: part2_morphology_serial_adapter
    renderer: render_fig3_morphology_serial_profile
    source: data/metrics/panel_b_morphology_serial_profile.csv
    source_mapping: {source_package: fig3_morphology_serial_supp, source_panel: A, canonical_root: results/paper_figure_multi_seed/fig3_multiitem_peak_landscape}
    position_mm: {x: 12, y: 72, w: 70, h: 34}
    axes_mm: {x: 22, y: 75, w: 60, h: 28}
    letter_mm: {x: 7, y: 67}
    size_mm: {w: 70, h: 34}
    focus_seq_len: 10
    focus_delay_ms: 400
    morphology_layer: layer1
    state_variable: g
    x_axis: Serial position
    y_axis: L1 STSP support
    expected_networks: 20
  D:
    panel_id: D
    legacy_panel_id: fig3_supp:S4E
    claim: Neutral ping reads out recent and earlier serial classes as well as the latest class.
    panel_type: ping_recency_decomposition
    producer_task: neutral_ping_access
    data_adapter: part2_existing_network_panel_adapter
    renderer: render_s5_ping_recency_decomposition
    source: data/metrics/panel_c_neutral_ping_position_distribution.csv
    summary_source: data/metrics/panel_c_neutral_ping_access_summary.csv
    source_mapping: {canonical_root: results/paper_figure_multi_seed/fig3_multiitem_peak_landscape, producer_task: neutral_ping_access}
    state_condition: S_final
    aggregation: sequence_condition_to_network
    inference_unit: independently trained network
    position_mm: {x: 88, y: 72, w: 70, h: 34}
    axes_mm: {x: 101, y: 75, w: 58, h: 28}
    letter_mm: {x: 83, y: 67}
    size_mm: {w: 70, h: 34}
    x_axis: Readout class
    y_axis: Readout mass
    expected_networks: 20
  E:
    panel_id: E
    legacy_panel_id: fig3_supp:S4F
    claim: Partial cues recover targets across serial-position bins from the sequence state.
    panel_type: weak_probe_recency_gain
    producer_task: weak_cue_access
    data_adapter: part2_existing_network_panel_adapter
    renderer: render_s5_weak_probe_recency_gain
    source: data/metrics/panel_d_weak_cue_item_metrics.csv
    source_mapping: {canonical_root: results/paper_figure_multi_seed/fig3_multiitem_peak_landscape, producer_task: weak_cue_access}
    contrast: sequence_state_minus_single_item_memory
    aggregation: trial_weighted_rows_to_network
    inference_unit: independently trained network
    position_mm: {x: 12, y: 124, w: 70, h: 34}
    axes_mm: {x: 22, y: 127, w: 60, h: 28}
    letter_mm: {x: 7, y: 119}
    size_mm: {w: 70, h: 34}
    x_axis: Target position bin
    y_axis: Recovery gain (pp)
    expected_networks: 20
  F:
    panel_id: F
    claim: Morphology retention and sequence-state rescue show aligned sequence-length by delay boundaries.
    panel_type: paired_boundary_heatmaps
    producer_task: boundary_summary
    data_adapter: part2_boundary_pair_adapter
    renderer: render_part2_boundary_pair
    source: data/metrics/panel_f_boundary_summary.csv
    source_mapping: {source_package: fig3_delay_supp, source_panels: [A, B], canonical_root: results/paper_figure_multi_seed/fig3_multiitem_peak_landscape}
    position_mm: {x: 88, y: 124, w: 70, h: 34}
    axes_mm: {x: 101, y: 127, w: 58, h: 28}
    letter_mm: {x: 83, y: 119}
    size_mm: {w: 70, h: 34}
    metrics: [N_eff_fraction, rescued_fraction]
    expected_seq_lengths: [3, 5, 7, 10]
    expected_delay_ms: [100, 200, 400, 800]
    x_axis: K
    y_axis: Delay (ms)
    expected_networks: 20
