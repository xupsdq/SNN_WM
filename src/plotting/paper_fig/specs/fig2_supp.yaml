figure_id: fig2_supp
figure_title_draft: "Supplementary Fig. S3: Morphological and functional controls for pair-specific fused STSP states"
experiment_root_default: results/paper_figure_multi_seed/fig2_pair_fused_stsp_state/fig2_pair_fused_stsp_state
canvas_mm:
  width: 165
  height: 116
gutters_mm:
  horizontal: 5
  vertical: 10
reading_order: [S3A, S3B, S3C, S3D, S3E]
run_modes: [single_network_draft, multi_network_final]
expected_outputs:
  full_figure: [pdf, svg, png]
  individual_panels: [svg, png]
  resolved_spec: fig2_supp_resolved_spec.yaml
  source_manifest: fig2_supp_source_manifest.json
  qc_report: fig2_supp_qc_report.md
qc_requirements:
  require_claims: true
  require_source_manifest: true
  require_position_mm: true
  require_size_mm: true
  canvas_mm: {width: 165, height: 116}
group_labels:
  - label: Supplementary Fig. S3 - Morphological integration controls
    x_mm: 12
    y_mm: 8
  - label: Functional robustness and retention-window controls
    x_mm: 12
    y_mm: 62
panels:
  S3A:
    panel_id: S3A
    claim: Whole-pair representation index is detectable across layers.
    panel_type: layerwise_morphology
    producer_task: morphology
    data_adapter: s3_wpri_across_layers_adapter
    renderer: render_s3_wpri_across_layers
    source_priority:
      - data/metrics/supp_layerwise_morphology_metrics.csv
      - data/metrics/panel_d_pair_level_organization_metrics.csv
    position_mm: {x: 12.00, y: 18.00, w: 45.67, h: 34.00}
    size_mm: {width: 45.67, height: 34.00}
    x_axis: Layer
    y_axis: WPRI
    reference_lines:
      - value: 0
        label: 0
  S3B:
    panel_id: S3B
    claim: Beyond-linear residual pair-specificity is detectable across layers.
    panel_type: layerwise_morphology
    producer_task: morphology
    data_adapter: s3_residual_across_layers_adapter
    renderer: render_s3_residual_across_layers
    source_priority:
      - data/metrics/supp_layerwise_morphology_metrics.csv
      - data/metrics/panel_d_linear_residual_pair_specificity_metrics.csv
    position_mm: {x: 62.67, y: 18.00, w: 45.67, h: 34.00}
    size_mm: {width: 45.67, height: 34.00}
    x_axis: Layer
    y_axis: Beyond-linear index
    reference_lines:
      - value: 0
        label: 0
  S3C:
    panel_id: S3C
    claim: Pair state is not fully explained by simple constituent-only or additive linear mixture models.
    panel_type: linear_model_comparison
    producer_task: linear_mixture
    data_adapter: s3_linear_model_comparison_adapter
    renderer: render_s3_linear_model_comparison
    source_priority:
      - data/metrics/supp_linear_mixture_model_comparison.csv
      - data/metrics/panel_d_linear_mixture_fit_metrics.csv
    model_order: [A_only, B_only, mean_AB, sum_AB, unconstrained_AB, convex_AB]
    position_mm: {x: 113.33, y: 18.00, w: 45.67, h: 34.00}
    size_mm: {width: 45.67, height: 34.00}
    x_axis: Model
    y_axis: "Fit R2"
    reference_lines: []
  S3D:
    panel_id: S3D
    legacy_panel_id: old_S4A
    claim: Neutral-ping access to the fused state is preserved across a tested range of ping amplitudes.
    panel_type: ping_sweep
    producer_task: ping_sweep
    data_adapter: s4_ping_sweep_adapter
    renderer: render_s4_ping_amplitude_sweep
    source: data/metrics/supp_ping_sweep_metrics.csv
    sweep_parameter: ping_amp
    position_mm: {x: 12.00, y: 72.00, w: 45.67, h: 34.00}
    size_mm: {width: 45.67, height: 34.00}
    x_axis: Ping amplitude
    y_axis: Pair-member readout (%)
    conditions: [S0, S_A, S_B, S_AB]
    reference_lines: []
  S3E:
    panel_id: S3E
    legacy_panel_id: old_S4B
    claim: Pair-state completion gain is strongest at short post-pair delays and decays across the retention interval, defining the functional completion window.
    panel_type: completion_delay_gain
    producer_task: completion_delay_sweep
    data_adapter: s4_completion_delay_adapter
    renderer: render_s4_completion_delay_gain
    source_priority:
      - data/metrics/supp_completion_delay_sweep_contrast.csv
      - data/metrics/supp_completion_delay_sweep_metrics.csv
    position_mm: {x: 113.33, y: 72.00, w: 45.67, h: 34.00}
    size_mm: {width: 45.67, height: 34.00}
    x_axis: Post-pair delay (ms)
    y_axis: Completion gain S_AB - relevant single (%)
    expected_delay_ms: [100, 200, 300, 400, 800, 1200]
    reference_lines:
      - value: 0
        label: 0
