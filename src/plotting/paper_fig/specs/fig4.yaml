figure_id: fig4
figure_title_draft: Successive inputs rewrite inherited STSP state under accumulated history
experiment_root: results/paper_figure_multi_seed/fig4_accumulated_history_statistics
canvas_mm: {width: 165, height: 102}
reading_order: [a, b, c, d, e]
scientific_question: >-
  Do successive inputs keep rewriting inherited STSP state, and how does
  accumulated history alter behavior while the transition machinery persists?
terminal_inference: >-
  Successive inputs repeatedly rewrite inherited STSP state beyond equal-time
  passive evolution; K5 lowers relation-balanced rescue and raises
  relation-balanced loss while transition components, event linkage, and
  downstream donor transfer remain detectable.
forbidden_inferences:
  - K5 rescue has a confirmed aligned-versus-mismatched reversal
  - K5 loss is equivalent to zero relation effect
  - K5 is progressive stage five
  - full-sequence organization or long-term memory
  - every progressive stage has a behavioral or donor-swap replication
expected_outputs:
  full_figure: [pdf, svg, png]
  individual_panels: [svg, png]
  resolved_spec: final_plot_spec.json
  source_manifest: source_manifest.csv
  visual_qa: visual_qa.json
qc_requirements:
  network_seeds: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009, 1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019]
  independent_unit: network_seed
  bootstrap_draws: 20000
  require_editable_vector_text: true
  require_plot_inside_slot: true
  forbid_dual_axis: true
  forbid_micro_subpanels: true
slots:
  a: [2.0, 2.0, 79.5, 48.0]
  b: [83.5, 2.0, 79.5, 48.0]
  c: [2.0, 52.0, 52.333, 48.0]
  d: [56.333, 52.0, 52.334, 48.0]
  e: [110.667, 52.0, 52.333, 48.0]
plot_bboxes_mm:
  a: [15.0, 9.0, 63.5, 31.0]
  b: [96.5, 9.0, 63.5, 31.0]
  c: [15.0, 59.0, 36.333, 30.0]
  d: [69.333, 59.0, 36.334, 30.0]
  e: [123.667, 59.0, 36.333, 30.0]
panels:
  a:
    chart: ordered_lines
    claim: Successive inputs repeatedly displace joint STSP state beyond equal-time passive evolution.
    source: data/panel_a_plot_data.csv
    x_axis: Stage
    x_values: [2, 3, 4, 5, 6, 7, 8, 9, 10]
    y_axis: State displacement
    y_limits: [0.0, 0.65]
    conditions: [observed, passive]
    legend: direct_labels
  b:
    chart: grouped_bars
    claim: Accumulated K5 history lowers rescue and raises loss.
    source: data/panel_b_plot_data.csv
    x_axis: History depth
    x_values: [K1, K5]
    y_axis: Rate (%)
    y_limits: [0.0, 70.0]
    conditions: [rescue, loss]
    comparison_rule: compare K1 to K5 within each outcome only
  c:
    chart: threshold_margin_bars
    claim: K5 retains both a common update and a history residual.
    source: data/panel_c_plot_data.csv
    x_values: [same_B_common_update_cosine, processing_residual_gamma_energy_fraction]
    y_axis: Value − threshold
    y_limits: [-0.05, 0.45]
    thresholds: {same_B_common_update_cosine: 0.5, processing_residual_gamma_energy_fraction: 0.05}
  d:
    chart: ordered_bars
    claim: K5 history residual remains concentrated at changed spike events.
    source: data/panel_d_plot_data.csv
    x_values: [matched_random, changed_events]
    y_axis: Residual magnitude
    y_limits: [0.0, 0.05]
  e:
    chart: category_points
    claim: Inherited L1 state still enters downstream updating and early output at K5.
    source: data/panel_e_plot_data.csv
    x_values: [layer1_only_layer2_update_donor_transfer, layer1_only_early_class_score_donor_transfer]
    y_axis: Donor-transfer index
    y_limits: [0.0, 1.0]
    raw_points: independent_networks_only
excluded_from_artwork:
  - K5_rescue_aligned_minus_mismatched
  - K5_loss_aligned_minus_mismatched
statistics_only_not_artwork:
  - rescue_depth_by_relation_interaction_K5_minus_K1
  - loss_depth_by_relation_interaction_K5_minus_K1
