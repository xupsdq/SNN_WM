figure_id: fig1
figure_title_draft: Network and STSP-state functional foundation
canvas_mm:
  width: 165
  height: 115
gutters_mm:
  horizontal: 4
  vertical: 6
reading_order: [A, B, C, D, E]
argument_bands:
  - band_id: row1_network_foundation
    label: Network foundation
    panels: [A, B]
  - band_id: row2_stsp_state_functional_foundation
    label: STSP-state functional foundation
    panels: [C, D, E]
expected_outputs:
  full_figure: [pdf, svg, png]
  individual_panels: [svg, png]
  resolved_spec: fig1_resolved_spec.yaml
  source_manifest: fig1_source_manifest.json
  qc_report: fig1_qc_report.md
qc_requirements:
  require_claims: true
  require_source_manifest: true
  require_reference_lines:
    B:
      - value: 10
        label: 10% chance
    C:
      - value: 10
        label: 10% chance
  require_manual_assets:
    - panel_id: A
      path: manual_assets/fig1a_architecture.svg
  require_n_networks:
    B: 20
    C: 20
    D: 20
    E: 20
  forbid_old_stem_panel_names: true
panels:
  A:
    panel_id: A
    claim: The STSP-SNN defines a direct visual-to-decision architecture and exposes layer-specific u/x states.
    panel_type: manual_schematic
    data_adapter: none
    renderer: render_manual_svg_panel
    source: manual_assets/fig1a_architecture.svg
    size_mm: {width: 125, height: 45}
    position_mm: {x: 0, y: 0, w: 125, h: 45}
    source_mapping:
      manual_asset: manual_assets/fig1a_architecture.svg
      source_status: manual_required
      notes: Fig.1A is a manuscript schematic, not an experiment output.
    x_axis: none
    y_axis: none
    reference_lines: []
    conditions: []
    legend_semantics: none
    stats_expected: none
    notes: This is a horizontal architecture pipeline, not a vertical flowchart. It should show input image/spike train -> temporal encoder -> STSP spiking layers -> earliest-spike readout, with u/x state capture from STSP layers.
  B:
    panel_id: B
    claim: The trained STSP-SNN achieves reliable baseline readout.
    panel_type: dot_summary
    data_adapter: fig1_overall_recall
    renderer: render_dot_summary
    size_mm: {width: 50, height: 46}
    position_mm: {x: 115, y: 0, w: 50, h: 46}
    source_mapping:
      source_experiment: multi_snn ensemble training
      preferred_files:
        - results/multi_snn/sdnn_ensemble_20/sdnn_ensemble_20/ensemble_summary.csv
      missing_data_flags:
        - class_specific_recall_missing
      notes: Overall recall only; class-specific recall remains missing from current sources.
    x_axis: STSP-SNN
    y_axis: Overall recall (%)
    reference_lines:
      - value: 10
        label: 10% chance
    conditions: [STSP-SNN]
    legend_semantics: none
    stats_expected:
      metric: overall_recall
      unit: percent
      n_networks: 20
      reference_value: 10
    notes: Show overall recall only. Class-specific recall should not be included in the main Fig.1.
  C:
    panel_id: C
    claim: Layer-specific u/x states retain prior input history.
    panel_type: layerwise_dot_summary
    data_adapter: fig1_delay_decoding
    renderer: render_layerwise_decoding
    size_mm: {width: 34, height: 46}
    position_mm: {x: 13, y: 58, w: 34, h: 46}
    source_mapping:
      source_experiment: engram_decode
      preferred_files:
        - results/multi_network/engram_decode/data/engram_decode_metrics__by_network.csv
      fallback_files:
        - results/engram_decode_experiment/data/engram_decode_metrics.csv
        - results/engram_decode_experiment/engram_decode_metrics.csv
      source_stem_aliases:
        - accuracy_vs_delay
      notes: Use the final/common delay summary by layer for the main panel.
    x_axis: Layer
    y_axis: Decoding accuracy (%)
    reference_lines:
      - value: 10
        label: 10% chance
    conditions:
      - Layer 1
      - Layer 2
      - Layer 3
    display_labels:
      Layer 1: L1
      Layer 2: L2
      Layer 3: L3
    legend_semantics: layer_identity
    stats_expected:
      metric: stsp_decode_acc
      unit: percent
      n_networks: 20
      reference_value: 10
    notes: Main Fig.1 uses layerwise decoding, not the full delay curve.
  D:
    panel_id: D
    claim: Dynamic STSP changes the outcome/error profile, indicating a functional history-dependent influence on readout.
    panel_type: error_rate_summary
    data_adapter: fig1_stsp_outcome_profile
    renderer: render_outcome_profile
    size_mm: {width: 40, height: 46}
    position_mm: {x: 61, y: 58, w: 40, h: 46}
    source_mapping:
      source_experiment: ux_shuffle_memory_collapse
      preferred_files:
        - results/multi_network/ux_shuffle_memory_collapse/data/metrics_condition_summary__by_network.csv
      fallback_files:
        - results/ux_shuffle_memory_collapse/data/metrics_condition_summary.csv
      source_stem_aliases:
        - memory_readout_target
      notes: Use network-level condition summaries and the existing error_rate column. Render a QC placeholder if error_rate is unavailable.
    x_axis: ""
    y_axis: Error rate (%)
    reference_lines: []
    preferred_conditions:
      - Dynamic STSP
      - u/x-shuffled
      - Static-frozen
    optional_conditions:
      - u/x-shuffled
    conditions:
      - Dynamic STSP
      - u/x-shuffled
      - Static-frozen
    display_labels:
      Dynamic STSP: Dynamic
      u/x-shuffled: shuffle
      Static-frozen: Static
    legend_semantics: none
    stats_expected:
      metric: error_rate
      unit: percent
      n_networks: 20
    notes: Main Fig.1D uses error rate, not correct/error/silent composition.
  E:
    panel_id: E
    claim: Swapping the retained u/x state redirects readout attribution from the original sample toward the donor trace.
    panel_type: paired_attribution_shift
    data_adapter: fig1_attribution_transfer
    renderer: render_paired_attribution_shift
    size_mm: {width: 50, height: 46}
    position_mm: {x: 115, y: 58, w: 50, h: 46}
    source_mapping:
      source_experiment: ux_shuffle_memory_collapse
      preferred_files:
        - results/multi_network/ux_shuffle_memory_collapse/data/metrics_condition_summary__by_network.csv
      fallback_files:
        - results/ux_shuffle_memory_collapse/data/metrics_condition_summary.csv
      raw_trial_globs:
        - results/multi_network/ux_shuffle_memory_collapse/runs/seed_*/data/trial_predictions.csv
      fallback_raw_trial_files:
        - results/ux_shuffle_memory_collapse/data/trial_predictions.csv
      source_stem_aliases:
        - memory_readout_target
      notes: Trace the condition summary back to trial-level predictions and decompose error trials only.
    x_axis: ""
    y_axis: Fraction within error trials (%)
    reference_lines: []
    conditions:
      - Dynamic baseline
      - shuffle
    display_labels:
      Dynamic baseline: Dynamic baseline
      shuffle: shuffle
    traces:
      - Original
      - Donor
      - Others
    legend_semantics: attribution_trace
    stats_expected:
      metric: error_conditional_fraction
      unit: percent
      n_networks: 20
    notes: Use mean network-level error-conditional fractions. Do not use all-trial absolute rates for this panel.
