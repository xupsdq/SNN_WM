figure_id: fig1
figure_title_draft: Functional STSP working-memory substrate
canvas_mm:
  width: 165
  height: 124
gutters_mm:
  horizontal: 6
  vertical: 7
reading_order: [A, B, C, D, E]
run_modes:
  single_network_draft:
    min_networks: 1
    manuscript_status: draft_only
  multi_network_final:
    min_networks: 2
    manuscript_status: final_statistics_ready
expected_outputs:
  full_figure: [pdf, svg, png]
  individual_panels: [svg, png]
  resolved_spec: fig1_resolved_spec.yaml
  source_manifest: fig1_source_manifest.json
  qc_report: fig1_qc_report.md
qc_requirements:
  require_claims: true
  require_source_manifest: true
  require_reference_lines:
    B:
      - value: 10
        label: 10% chance
    C:
      - value: 10
        label: 10% chance
  required_main_conditions: [dynamic_intact, ux_trial_shuffle, static_frozen]
  supplementary_conditions: [spike_state_shuffle, membrane_state_shuffle]
  required_decode_layers: [layer1, layer2, layer3]
  single_network_warning: true
supplementary_outputs:
  - data/metrics/supp_class_recall_by_digit.csv
  - data/metrics/supp_confusion_matrix_long.csv
  - data/metrics/supp_delay_decode_curve.csv
  - data/metrics/supp_dms_delay_sweep_metrics.csv
  - data/metrics/supp_dms_delay_sweep_contrast.csv
  - data/metrics/supp_substrate_shuffle_metrics.csv
  - data/metrics/supp_phase_firing_rates.csv
  - data/metrics/supp_trial_condition_audit.csv
panels:
  A:
    panel_id: A
    claim: STSP-SNN task architecture exposes layer-wise synaptic state.
    panel_type: manual_or_programmatic_schematic
    data_adapter: none
    renderer: render_fig1_architecture_schematic
    source: manual_assets/fig1a_architecture.svg
    position_mm: {x: 12, y: 8, w: 147, h: 24}
    size_mm: {w: 147, h: 24}
    source_mapping:
      manual_asset: manual_assets/fig1a_architecture.svg
      source_status: manual_optional_programmatic_placeholder
      notes: Fig.1A is a schematic panel, not an experiment output.
    x_axis: none
    y_axis: none
  B:
    panel_id: B
    claim: The trained STSP-SNN achieves reliable class-level readout.
    panel_type: baseline_performance
    data_adapter: fig1_baseline_adapter
    renderer: render_fig1_baseline_recall
    source: data/metrics/panel_b_baseline_metrics_by_network.csv
    position_mm: {x: 12, y: 39, w: 70.5, h: 30}
    size_mm: {w: 70.5, h: 30}
    x_axis: Network
    y_axis: Recall (%)
    reference_lines:
      - value: 10
        label: 10% chance
    conditions: [STSP-SNN]
    stats_expected:
      metric: overall_recall
      unit: percent
  C:
    panel_id: C
    claim: Delay-period STSP u/x state retains sample identity across STSP-enabled layers.
    panel_type: layerwise_delay_decode_summary
    data_adapter: fig1_delay_decode_summary_adapter
    renderer: render_fig1_delay_decode_summary
    source: data/metrics/panel_c_delay_decode_metrics.csv
    position_mm: {x: 88.5, y: 39, w: 70.5, h: 30}
    size_mm: {w: 70.5, h: 30}
    x_axis: Layer
    y_axis: Decoding accuracy (%)
    reference_lines:
      - value: 10
        label: 10% chance
    conditions: [layer1, layer2, layer3]
    display_labels:
      layer1: L1
      layer2: L2
      layer3: L3
    stats_expected:
      metric: delay_decode_accuracy
      unit: percent
  D:
    panel_id: D
    claim: Dynamic STSP state affects later probe readout relative to static-frozen and u/x shuffle controls.
    panel_type: condition_comparison
    data_adapter: fig1_condition_metrics_adapter
    renderer: render_fig1_condition_comparison
    source: data/metrics/panel_d_condition_metrics.csv
    position_mm: {x: 12, y: 76, w: 70.5, h: 40}
    size_mm: {w: 70.5, h: 40}
    x_axis: ""
    y_axis: Probe error (%)
    conditions: [dynamic_intact, ux_trial_shuffle, static_frozen]
    display_labels:
      dynamic_intact: Dynamic
      ux_trial_shuffle: u/x shuffle
      static_frozen: Static
    stats_expected:
      metric: error_rate
      unit: percent
  E:
    panel_id: E
    claim: Replacing retained u/x state changes the composition of probe errors, shifting errors toward donor-memory attribution.
    panel_type: error_composition
    data_adapter: fig1_error_composition_adapter
    renderer: render_fig1_error_composition
    source_priority:
      - data/raw/panel_d_dms_condition_trial_readout.csv
      - data/metrics/panel_d_condition_metrics.csv
      - data/metrics/panel_e_attribution_metrics.csv
    position_mm: {x: 88.5, y: 76, w: 70.5, h: 40}
    size_mm: {w: 70.5, h: 40}
    x_axis: ""
    y_axis: Error composition (% of errors)
    conditions: [dynamic_intact, ux_trial_shuffle]
    categories: [Original, Donor, Other]
    traces: [Original, Donor, Other]
    display_labels:
      dynamic_intact: Dynamic
      ux_trial_shuffle: u/x shuffle
    stats_expected:
      metric: error_composition_within_error_pool
      unit: percent_of_errors
