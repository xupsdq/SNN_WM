figure_id: fig5_supp
figure_title_draft: "Supplementary Fig. S6: Controls for local support competition and causal STSP perturbation"
experiment_root: results/paper_figure_multi_seed/fig5_local_support_competition/fig5_local_support_competition
canvas_mm:
  width: 165
  height: 124
reading_order: [S6A, S6B, S6C, S6D, S6E, S6F]
panel_label_fontsize: 8.5
group_labels:
  - label: Supplementary Fig. S6 - Local support competition and causal controls
    x_mm: 12
    y_mm: 8
expected_outputs:
  full_figure: [pdf, svg, png]
  individual_panels: [svg, png]
  resolved_spec: fig5_supp_resolved_spec.yaml
  source_manifest: fig5_supp_source_manifest.json
  qc_report: fig5_supp_qc_report.md
qc_requirements:
  require_claims: true
  require_source_manifest: true
  require_position_mm: true
  require_size_mm: true
  single_network_warning: true
panels:
  S6A:
    panel_id: S6A
    producer_task: early_firing
    legacy_panel_id: old_S9A
    panel_type: early_window_robustness
    claim: Early transition effects are robust to early-window definition.
    data_adapter: s9_early_window_robustness_adapter
    renderer: render_s9_early_window_robustness
    source: data/metrics/supp_early_window_robustness.csv
    position_mm: {x: 12.00, y: 18.00, w: 70.50, h: 28.00}
    panel_label_mm: {x: 9.00, y: 13.00}
    size_mm: {w: 70.50, h: 28.00}
    x_axis: Early window (ms)
    y_axis: Advance + recruit probability
  S6B:
    panel_id: S6B
    producer_task: early_firing
    legacy_panel_id: old_S9B
    panel_type: trialwise_transition_advantage
    claim: Overlap-dominant units show a trial-consistent advance/recruit advantage over matched control groups.
    data_adapter: s9_trialwise_transition_advantage_adapter
    renderer: render_s9_trialwise_transition_advantage
    source_priority:
      - data/metrics/panel_b_transition_summary_by_group.csv
      - data/metrics/supp_s9_transition_composition_by_group.csv
    position_mm: {x: 88.50, y: 18.00, w: 70.50, h: 28.00}
    panel_label_mm: {x: 85.50, y: 13.00}
    size_mm: {w: 70.50, h: 28.00}
    metric: delta_P_advance_plus_recruit
    x_axis: Control group
    y_axis: Delta P(advance + recruit)
  S6C:
    panel_id: S6C
    producer_task: [local_events, supplement]
    legacy_panel_id: old_S9C
    panel_type: event_chain_null
    claim: Observed local event-chain fractions exceed null baselines.
    data_adapter: s9_event_chain_null_adapter
    renderer: render_s9_event_chain_null
    source_priority:
      - data/metrics/supp_event_chain_fraction_metrics.csv
      - data/metrics/supp_event_chain_null_baselines.csv
      - data/metrics/supp_s9_event_chain_null_summary.csv
    position_mm: {x: 12.00, y: 52.00, w: 70.50, h: 30.00}
    panel_label_mm: {x: 9.00, y: 47.00}
    size_mm: {w: 70.50, h: 30.00}
    x_axis: Event-chain metric
    y_axis: Fraction
  S6D:
    panel_id: S6D
    producer_task: support_perturbation
    legacy_panel_id: old_S9D
    panel_type: perturbation_ux_audit
    claim: Attenuate/reset perturbations modify intended STSP variables at the pre-probe boundary.
    data_adapter: s9_perturbation_ux_audit_adapter
    renderer: render_s9_perturbation_ux_audit
    source_priority:
      - data/metrics/supp_s10_perturbation_ux_audit.csv
      - data/metrics/supp_perturbation_ux_audit.csv
    position_mm: {x: 88.50, y: 52.00, w: 70.50, h: 30.00}
    panel_label_mm: {x: 85.50, y: 47.00}
    size_mm: {w: 70.50, h: 30.00}
    x_axis: Perturbation condition
    y_axis: Mean variable delta
  S6E:
    panel_id: S6E
    producer_task: support_perturbation
    legacy_panel_id: old_S9E
    panel_type: perturbation_transition_contrast
    claim: Attenuate/reset perturbations reduce advance/recruit transitions relative to dynamic state.
    data_adapter: s9_perturbation_transition_contrast_adapter
    renderer: render_s9_perturbation_transition_contrast
    source_priority:
      - data/metrics/supp_s10_perturbation_transition_contrast.csv
      - data/metrics/panel_d_perturbation_transition_contrast.csv
    position_mm: {x: 12.00, y: 88.00, w: 70.50, h: 30.00}
    panel_label_mm: {x: 9.00, y: 83.00}
    size_mm: {w: 70.50, h: 30.00}
    x_axis: Unit group
    y_axis: Delta advance + recruit
  S6F:
    panel_id: S6F
    producer_task: support_perturbation
    legacy_panel_id: old_S9F
    panel_type: same_winner_lost_delayed
    claim: STSP perturbation causes same-winner units to be lost or delayed.
    data_adapter: s9_same_winner_lost_delayed_adapter
    renderer: render_s9_same_winner_lost_delayed
    source_priority:
      - data/metrics/supp_s10_same_winner_lost_delayed.csv
      - data/metrics/supp_s10_same_winner_disruption.csv
      - data/metrics/panel_d_perturbation_transition_summary_by_group.csv
      - data/metrics/panel_d_perturbation_unit_transitions.csv
    position_mm: {x: 88.50, y: 88.00, w: 70.50, h: 30.00}
    panel_label_mm: {x: 85.50, y: 83.00}
    size_mm: {w: 70.50, h: 30.00}
    x_axis: Perturbation condition
    y_axis: Same-winner probability
