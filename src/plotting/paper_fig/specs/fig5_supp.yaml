figure_id: fig5_supp
figure_title_draft: "Supplementary Fig. S9-S10: Local transition controls and support-perturbation causal controls"
experiment_root: results/paper_experiments/fig5_local_support_competition
canvas_mm:
  width: 165
  height: 236
reading_order: [S9A, S9B, S9C, S9D, S9E, S10A, S10B, S10C, S10D, S10E]
group_labels:
  - label: Supplementary Fig. S9 - Local firing-transition and event-chain controls
    x_mm: 12
    y_mm: 8
  - label: Supplementary Fig. S10 - Support-perturbation causal controls
    x_mm: 12
    y_mm: 128
expected_outputs:
  full_figure: [pdf, svg, png]
  individual_panels: [svg, png]
  resolved_spec: fig5_supp_resolved_spec.yaml
  source_manifest: fig5_supp_source_manifest.json
  qc_report: fig5_supp_qc_report.md
qc_requirements:
  require_claims: true
  require_source_manifest: true
  require_position_mm: true
  require_size_mm: true
  single_network_warning: true
  optional_panels: [S10E]
panels:
  S9A:
    panel_id: S9A
    panel_type: early_window_robustness
    claim: Early transition effect is robust to early-window definition.
    data_adapter: s9_early_window_robustness_adapter
    renderer: render_s9_early_window_robustness
    source: data/metrics/supp_early_window_robustness.csv
    position_mm: {x: 12.00, y: 18.00, w: 70.50, h: 28.00}
    size_mm: {w: 70.50, h: 28.00}
    x_axis: Early window (ms)
    y_axis: Advance + recruit probability
  S9B:
    panel_id: S9B
    panel_type: transition_composition
    claim: Full transition composition supports the main early-transition summary.
    data_adapter: s9_transition_composition_adapter
    renderer: render_s9_transition_composition
    source_priority:
      - data/metrics/supp_s9_transition_composition_by_group.csv
      - data/metrics/panel_b_transition_summary_by_group.csv
    position_mm: {x: 88.50, y: 18.00, w: 70.50, h: 28.00}
    size_mm: {w: 70.50, h: 28.00}
    transition_categories: [P_advance, P_recruit, P_loss, P_unchanged]
    x_axis: Unit group
    y_axis: Transition probability
  S9C:
    panel_id: S9C
    panel_type: event_trace
    claim: Event-aligned winner-loser traces are stable across event sampling.
    data_adapter: s9_event_trace_adapter
    renderer: render_s9_event_trace
    source_priority:
      - data/metrics/supp_s9_event_trace_summary.csv
      - data/metrics/panel_c_event_trace_summary.csv
    position_mm: {x: 12.00, y: 52.00, w: 70.50, h: 30.00}
    size_mm: {w: 70.50, h: 30.00}
    x_axis: Time from winner spike (ms)
    y_axis: Dynamic minus static
  S9D:
    panel_id: S9D
    panel_type: event_chain_null
    claim: Event-chain fractions exceed null baselines.
    data_adapter: s9_event_chain_null_adapter
    renderer: render_s9_event_chain_null
    source_priority:
      - data/metrics/supp_event_chain_fraction_metrics.csv
      - data/metrics/supp_event_chain_null_baselines.csv
      - data/metrics/supp_s9_event_chain_null_summary.csv
    position_mm: {x: 88.50, y: 52.00, w: 70.50, h: 30.00}
    size_mm: {w: 70.50, h: 30.00}
    x_axis: Event-chain metric
    y_axis: Fraction
  S9E:
    panel_id: S9E
    panel_type: neighborhood_event_audit
    claim: Local event-chain effects are robust to neighborhood radius and event-selection choices.
    data_adapter: s9_neighborhood_event_audit_adapter
    renderer: render_s9_neighborhood_event_audit
    source_priority:
      - data/metrics/supp_neighborhood_radius_robustness.csv
      - data/metrics/supp_event_selection_audit.csv
    position_mm: {x: 12.00, y: 88.00, w: 147.00, h: 30.00}
    size_mm: {w: 147.00, h: 30.00}
    x_axis: Neighborhood radius
    y_axis: Event-chain metric
  S10A:
    panel_id: S10A
    panel_type: perturbation_ux_audit
    claim: Attenuate/reset perturbations modify intended STSP u/x/g variables at the pre-probe boundary.
    data_adapter: s10_perturbation_ux_audit_adapter
    renderer: render_s10_perturbation_ux_audit
    source_priority:
      - data/metrics/supp_s10_perturbation_ux_audit.csv
      - data/metrics/supp_perturbation_ux_audit.csv
    position_mm: {x: 12.00, y: 138.00, w: 70.50, h: 28.00}
    size_mm: {w: 70.50, h: 28.00}
    x_axis: Perturbation condition
    y_axis: Mean variable delta
  S10B:
    panel_id: S10B
    panel_type: perturbation_transition_contrast
    claim: Attenuate/reset perturbations alter local transition outcomes relative to dynamic state.
    data_adapter: s10_perturbation_transition_contrast_adapter
    renderer: render_s10_perturbation_transition_contrast
    source_priority:
      - data/metrics/supp_s10_perturbation_transition_contrast.csv
      - data/metrics/panel_d_perturbation_transition_contrast.csv
    position_mm: {x: 88.50, y: 138.00, w: 70.50, h: 28.00}
    size_mm: {w: 70.50, h: 28.00}
    x_axis: Unit group
    y_axis: Delta transition probability
  S10C:
    panel_id: S10C
    panel_type: same_winner_lost_delayed
    claim: Perturbation causes same-winner units to be lost or delayed.
    data_adapter: s10_same_winner_lost_delayed_adapter
    renderer: render_s10_same_winner_lost_delayed
    source_priority:
      - data/metrics/supp_s10_same_winner_lost_delayed.csv
      - data/metrics/supp_s10_same_winner_disruption.csv
      - data/metrics/panel_d_perturbation_transition_summary_by_group.csv
      - data/metrics/panel_d_perturbation_unit_transitions.csv
    position_mm: {x: 12.00, y: 172.00, w: 70.50, h: 30.00}
    size_mm: {w: 70.50, h: 30.00}
    x_axis: Perturbation condition
    y_axis: Same-winner probability
  S10D:
    panel_id: S10D
    panel_type: dynamic_like_recovery
    claim: Attenuate/reset perturbations reduce dynamic-like spike/readout recovery.
    data_adapter: s10_dynamic_like_recovery_adapter
    renderer: render_s10_dynamic_like_recovery
    source_priority:
      - data/metrics/supp_s10_dynamic_like_recovery_after_perturbation.csv
      - data/metrics/panel_d_support_perturbation_node_metrics.csv
      - data/metrics/panel_d_perturbation_effect_summary.csv
    position_mm: {x: 88.50, y: 172.00, w: 70.50, h: 30.00}
    size_mm: {w: 70.50, h: 30.00}
    x_axis: Perturbation condition
    y_axis: Dynamic-like recovery
  S10E:
    panel_id: S10E
    panel_type: sham_matching_controls
    optional: true
    claim: Perturbation effects exceed sham and are not explained by unit-set mismatch.
    data_adapter: s10_sham_matching_controls_adapter
    renderer: render_s10_sham_matching_controls
    source_priority:
      - data/metrics/supp_s10_support_perturbation_controls.csv
      - data/metrics/supp_s10_perturbation_matching_diagnostics.csv
      - data/metrics/panel_d_support_perturbation_node_metrics.csv
    position_mm: {x: 12.00, y: 206.00, w: 147.00, h: 24.00}
    size_mm: {w: 147.00, h: 24.00}
    x_axis: Control
    y_axis: Value / matching error
