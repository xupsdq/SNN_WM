figure_id: supp_fig_s1
implementation_id: fig1_supp
figure_title_draft: "Supplementary Fig. S1: Activity-silent maintenance and substrate specificity"
experiment_root_default: results/paper_figure_multi_seed/fig1_functional_stsp_substrate/fig1_functional_stsp_substrate
canvas_mm: {width: 165, height: 116}
individual_axes: {left: 0.30, right: 0.97, bottom: 0.38, top: 0.87}
reading_order: [A, B, C, D]
expected_outputs:
  full_figure: [pdf, svg, png]
  individual_panels: [svg, png]
  resolved_spec: supp_fig_s1_resolved_spec.yaml
  source_manifest: supp_fig_s1_source_manifest.json
  qc_report: supp_fig_s1_qc_report.md
  panel_data: panel_data/*.csv
  stats: stats/*.json
  source_manifests: source_manifests/*.json
qc_requirements:
  strict_part2: true
  expected_panel_count: 4
  minimum_networks: 20
  allowed_network_counts: [20]
  require_claims: true
  require_source_manifest: true
  require_position_mm: true
  require_size_mm: true
  forbid_single_network: true
  forbid_fallback: true
group_labels:
  - {label: "Supplementary Fig. S1 - Activity-silent maintenance and substrate specificity", x_mm: 12, y_mm: 7}
panels:
  A:
    panel_id: A
    legacy_panel_id: fig1_supp_s2:S2A
    claim: Population spiking falls during the delay while information remains available in synaptic state.
    panel_type: grouped_line_or_bar
    producer_task: firing_rate_control
    data_adapter: s2_phase_firing_adapter
    renderer: render_phase_firing_rates
    source: data/metrics/supp_phase_firing_rates.csv
    source_mapping: {source_package: fig1_supp_s2, source_panel: S2A, panel_data: results/paper_figures/outputs/fig1_supp_s2/panel_data/fig1_supp_s2S2A_panel_data.csv}
    position_mm: {x: 12, y: 20, w: 70.5, h: 36}
    axes_mm: {x: 25, y: 22, w: 57, h: 27}
    panel_label_mm: {x: 3, y: 15}
    size_mm: {w: 70.5, h: 58}
    x_axis: Phase
    y_axis: Population spike rate (spikes s$^{-1}$)
    conditions: [layer1, layer2, layer3]
    expected_networks: 20
  B:
    panel_id: B
    legacy_panel_id: fig1_supp_s2:S2B
    claim: Sample identity remains decodable from STSP variables across the delay.
    panel_type: line_timecourse
    producer_task: delay_decoder
    data_adapter: s2_delay_decode_curve_adapter
    renderer: render_delay_decode_timecourse
    source_priority: [data/metrics/supp_delay_decode_curve.csv, data/metrics/panel_c_delay_decode_metrics.csv]
    source_mapping: {source_package: fig1_supp_s2, source_panel: S2B, panel_data: results/paper_figures/outputs/fig1_supp_s2/panel_data/fig1_supp_s2S2B_panel_data.csv}
    position_mm: {x: 88.5, y: 20, w: 70.5, h: 36}
    axes_mm: {x: 101, y: 22, w: 58, h: 27}
    panel_label_mm: {x: 85, y: 15}
    size_mm: {w: 70.5, h: 52}
    x_axis: Delay (ms)
    y_axis: Decoding accuracy (%)
    reference_lines: [{value: 10, label: "10% chance"}]
    conditions: [layer1, layer2, layer3]
    display_labels: {layer1: L1, layer2: L2, layer3: L3}
    expected_networks: 20
  C:
    panel_id: C
    legacy_panel_id: fig1_supp_s2:S2C
    claim: Static and dynamic STSP conditions differ most at short delays, and the static-minus-dynamic accuracy contrast narrows as delay lengthens.
    panel_type: line_timecourse_or_bar
    producer_task: dms_delay_sweep_readout
    data_adapter: s2_dms_delay_contrast_adapter
    renderer: render_stsp_interference_delay
    source_priority: [data/metrics/supp_dms_delay_sweep_contrast.csv, data/metrics/supp_dms_delay_sweep_metrics.csv]
    source_mapping: {source_package: fig1_supp_s2, source_panel: S2C, panel_data: results/paper_figures/outputs/fig1_supp_s2/panel_data/fig1_supp_s2S2C_panel_data.csv}
    position_mm: {x: 12, y: 68, w: 70.5, h: 36}
    axes_mm: {x: 25, y: 76, w: 57, h: 26}
    panel_label_mm: {x: 3, y: 63}
    size_mm: {w: 70.5, h: 58}
    x_axis: Delay (ms)
    y_axis: Static - dynamic accuracy (pp)
    conditions: [static_minus_dynamic]
    expected_networks: 20
  D:
    panel_id: D
    legacy_panel_id: fig1_supp_s2:S2D
    claim: Donor-specific readout depends most strongly on the dynamic u/x substrate among the tested state variables.
    panel_type: ordered_condition_comparison
    producer_task: dms_shuffle_readout
    data_adapter: s2_substrate_specificity_adapter
    renderer: render_substrate_shuffle_specificity
    source_priority: [data/metrics/supp_substrate_shuffle_metrics.csv, data/metrics/compat_metrics_condition_summary.csv]
    source_mapping: {source_package: fig1_supp_s2, source_panel: S2D, panel_data: results/paper_figures/outputs/fig1_supp_s2/panel_data/fig1_supp_s2S2D_panel_data.csv, recovered_existing_seed: 1005}
    position_mm: {x: 88.5, y: 68, w: 70.5, h: 36}
    axes_mm: {x: 101, y: 76, w: 58, h: 26}
    panel_label_mm: {x: 85, y: 63}
    size_mm: {w: 70.5, h: 55}
    x_axis: ""
    y_axis: Donor attribution gain (pp)
    conditions: [dynamic_intact, spike_state_shuffle, membrane_state_shuffle, ux_trial_shuffle, static_frozen]
    display_labels: {dynamic_intact: Dynamic, spike_state_shuffle: Spike, membrane_state_shuffle: Vm, ux_trial_shuffle: "u/x shuffle", static_frozen: Static}
    expected_networks: 20
