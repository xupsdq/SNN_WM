figure_id: fig3
figure_title_draft: Multi-item sequence state rescues access beyond singleton traces
scientific_contract: sequence_chunk_rescue_v1
experiment_root_default: results/paper_figure_multi_seed/fig3_multiitem_peak_landscape
canvas_mm:
  width: 165
  height: 102
reading_order: [A, B, C, D, E]
run_modes:
  - single_network_draft
  - multi_network_final
argument_bands:
  - band_id: morphology
    label: Morphology
    panels: [A]
  - band_id: function
    label: Functional access
    panels: [B, C, D, E]
expected_outputs:
  full_figure: [pdf, svg, png]
  resolved_spec: fig3_resolved_spec.yaml
  source_manifest: fig3_source_manifest.json
  qc_report: fig3_qc_report.md
  panel_data: panel_data/*.csv
  stats: stats/*.json
  source_manifests: source_manifests/*.json
qc_requirements:
  require_claims: true
  require_source_manifest: true
  canvas_mm: {width: 165, height: 102}
  require_position_mm: true
  require_size_mm: true
  morphology_layer: layer1
  required_rescue_metrics: [N_eff, target_probability, rescued_fraction]
  expected_seq_lengths: [3, 5, 7, 10]
  expected_delay_ms: [100, 200, 400, 800]
  single_network_warning: true
panels:
  A:
    panel_id: A
    claim: L1 STSP morphology is capacity-compressed at high K instead of preserving ten independent item traces.
    panel_type: morphology_capacity
    producer_task: [morphology_decomposition, boundary_summary]
    data_adapter: fig3_morphology_capacity_adapter
    renderer: render_fig3_morphology_capacity
    source: data/metrics/panel_c_morphology_boundary_metrics.csv
    size_mm: {w: 79.50, h: 48.00}
    position_mm: {x: 2.00, y: 2.00, w: 79.50, h: 48.00}
    letter_mm: {x: 2.00, y: 2.00}
    metric: N_eff
    focus_delay_ms: 400
    morphology_layer: layer1
    state_variable: g
    x_axis: Sequence length (items)
    y_axis: Effective items
  B:
    panel_id: B
    claim: Full sequence state keeps early items accessible after slot-matched singleton memory has collapsed.
    panel_type: access_serial_profile
    producer_task: weak_cue_access
    data_adapter: fig3_access_serial_profile_adapter
    renderer: render_fig3_access_serial_profile
    source: data/metrics/panel_d_item_functional_gain.csv
    size_mm: {w: 79.50, h: 48.00}
    position_mm: {x: 83.50, y: 2.00, w: 79.50, h: 48.00}
    letter_mm: {x: 83.50, y: 2.00}
    metric: target_probability
    focus_seq_len: 10
    focus_delay_ms: 400
    x_axis: Serial position
    y_axis: Target readout probability
  C:
    panel_id: C
    claim: Matched weak cues selectively recover the target item more than mismatched or unseen controls.
    panel_type: cue_specificity_target_profile
    producer_task: cue_specificity_access
    data_adapter: fig3_cue_specificity_target_profile_adapter
    renderer: render_fig3_cue_specificity_target_profile
    source: data/metrics/panel_c_cue_specificity_serial_summary.csv
    size_mm: {w: 52.333, h: 48.00}
    position_mm: {x: 2.00, y: 52.00, w: 52.333, h: 48.00}
    letter_mm: {x: 2.00, y: 50.00}
    metric: target_probability
    focus_seq_len: 7
    focus_delay_ms: 400
    state_condition: S_final
    cue_types: [matched, mismatched, unseen]
    x_axis: Serial position
    y_axis: Target readout probability
  D:
    panel_id: D
    claim: Sequence-state rescue becomes more prevalent as item count increases.
    panel_type: rescue_fraction
    producer_task: [weak_cue_access, boundary_summary]
    data_adapter: fig3_rescue_fraction_adapter
    renderer: render_fig3_rescue_fraction
    source: data/metrics/panel_d_item_functional_gain.csv
    size_mm: {w: 52.333, h: 48.00}
    position_mm: {x: 56.333, y: 52.00, w: 52.333, h: 48.00}
    letter_mm: {x: 56.333, y: 50.00}
    metric: rescued_fraction
    metrics_to_plot: [rescued_fraction]
    focus_delay_ms: 400
    access_threshold: 0.0
    annotate_counts: false
    x_axis: Sequence length (items)
    y_axis: Rescued item fraction
    y_label_x: -0.12
  E:
    panel_id: E
    claim: Functional rescue occupies a K x delay boundary across sequence length and retention interval.
    panel_type: delay_boundary_heatmap
    producer_task: boundary_summary
    data_adapter: fig3_delay_boundary_heatmap_adapter
    renderer: render_fig3_boundary_heatmap
    source: data/metrics/panel_f_boundary_summary.csv
    size_mm: {w: 52.333, h: 48.00}
    position_mm: {x: 110.667, y: 52.00, w: 52.333, h: 48.00}
    letter_mm: {x: 110.667, y: 50.00}
    metric: rescued_fraction
    vmin: 0.0
    vmax: 1.0
    x_axis: Sequence length (items)
    y_axis: Delay (ms)
    y_label_x: -0.12
