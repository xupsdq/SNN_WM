<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="690" viewBox="0 0 1460 690" role="img" aria-labelledby="title desc">
<title id="title">DAG result evidence audit overview</title>
<desc id="desc">Derived, non-authoritative navigation graph from code tasks through bundles and plot-only consumers.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/></marker></defs>
